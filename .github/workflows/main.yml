name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  THEME_DIR: web/themes/amitee_theme

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.THEME_DIR }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ env.THEME_DIR }}/package-lock.json

      - name: Build theme CSS
        working-directory: ${{ env.THEME_DIR }}
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Pull code on server
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -euo pipefail
            cd /var/www/drupal
            git pull --ff-only origin main
            composer install --no-dev --optimize-autoloader --no-interaction
          EOF

      - name: Upload built CSS
        run: |
          rsync -az --delete \
            ${{ env.THEME_DIR }}/css/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/drupal/${{ env.THEME_DIR }}/css/

      - name: Finish deploy
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'cd /var/www/drupal && vendor/bin/drush deploy -y'